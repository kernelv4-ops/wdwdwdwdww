name: Build Latest Clang for Alpine AArch64 (Ubuntu Base)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Build Clang 18 for Alpine AArch64
        run: |
          mkdir -p /tmp/clang-build
          cd /tmp/clang-build
          
          docker run --rm \
            --volume="/tmp/clang-build:/workspace" \
            --workdir="/workspace" \
            ubuntu:22.04 bash -c "
            set -ex
            
            # Update Ubuntu
            apt-get update
            apt-get install -y \
              build-essential \
              cmake \
              ninja-build \
              git \
              wget \
              tar \
              xz-utils \
              python3 \
              libncurses-dev \
              zlib1g-dev \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              binutils-aarch64-linux-gnu
            
            # Versi TERBARU: LLVM 18.1.8
            echo 'Downloading LLVM 18.1.8...'
            wget -q https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz
            tar -xf llvm-project-18.1.8.src.tar.xz
            
            # 1. Build Host Tools
            mkdir build-host && cd build-host
            cmake ../llvm-project-18.1.8.src/llvm -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_TARGETS_TO_BUILD='X86' \
              -DLLVM_ENABLE_PROJECTS='clang' \
              -DLLVM_INCLUDE_TESTS=OFF
            ninja llvm-tblgen clang-tblgen
            cd ..
            
            # 2. Cross-compile untuk AArch64
            mkdir build-aarch64 && cd build-aarch64
            
            cmake ../llvm-project-18.1.8.src/llvm -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DLLVM_ENABLE_PROJECTS='clang;polly' \
              -DLLVM_TARGETS_TO_BUILD='AArch64' \
              -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-gnu \
              -DCMAKE_CROSSCOMPILING=True \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
              -DCMAKE_C_FLAGS='-fPIC' \
              -DCMAKE_CXX_FLAGS='-fPIC' \
              -DLLVM_TABLEGEN=/workspace/build-host/bin/llvm-tblgen \
              -DCLANG_TABLEGEN=/workspace/build-host/bin/clang-tblgen \
              -DLLVM_POLLY_LINK_INTO_TOOLS=ON \
              -DLLVM_INCLUDE_TESTS=OFF \
              -DLLVM_INCLUDE_EXAMPLES=OFF \
              -DLLVM_INCLUDE_UTILS=OFF \
              -DLLVM_ENABLE_RTTI=OFF \
              -DLLVM_ENABLE_EH=OFF \
              -DCMAKE_INSTALL_PREFIX=/workspace/clang-18-aarch64
            
            echo 'Building...'
            ninja -j\$(nproc)
            ninja install
            
            cd ..
            
            # 3. Optimize untuk Alpine (musl)
            echo 'Optimizing for Alpine musl...'
            cd clang-18-aarch64
            strip -s bin/* lib/* || true
            
            # Buat symlinks
            cd bin
            ln -sf clang-18 clang
            ln -sf clang clang++
            ln -sf clang cc
            ln -sf clang++ c++
            cd ..
            
            # Buat README
            cat > README-ALPINE.md << 'EOF'
            # Clang 18.1.8 for Alpine Linux AArch64
            Built on Ubuntu but optimized for Alpine musl
            
            Installation on Alpine:
            1. apk add libstdc++  # Jika diperlukan
            2. tar -xzvf clang-alpine-aarch64.tar.gz -C /usr/local
            3. export PATH=/usr/local/bin:\$PATH
            
            Test:
            clang --version
            clang -static test.c -o test  # Musl advantage!
            EOF
            
            # Package
            cd /workspace
            tar -czvf clang-18-alpine-aarch64.tar.gz clang-18-aarch64/
            
            echo '=== SUCCESS ==='
            ls -lh clang-18-alpine-aarch64.tar.gz
          "
          
          cp /tmp/clang-build/clang-18-alpine-aarch64.tar.gz ${{ github.workspace }}/
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-18-alpine-aarch64
          path: clang-18-alpine-aarch64.tar.gz
